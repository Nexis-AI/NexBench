name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type-check & build
        run: npm run build
      - name: Test
        run: node --test dist/tests/*.test.js
      - name: Release metadata is internally consistent
        run: node scripts/verify-release.mjs
      - name: Reference baseline solves the runnable suite
        run: node dist/src/cli/index.js run --agent scripted --out runs/ci
      - name: Public catalog is exactly 6 runnable-local plus 18 metadata-only
        run: node dist/src/cli/index.js tasks --json >/dev/null
      - name: Every reference manifest validates
        run: |
          for f in results/*.json; do
            node dist/src/cli/index.js validate "$f" >/dev/null || exit 1
          done
      - name: Environment-pins digest matches
        run: node dist/src/cli/index.js pins --digest
      - name: Scorecard renderer works on a real report
        run: |
          node dist/src/cli/index.js run --agent example --out runs/card >/dev/null
          node scripts/scorecard.mjs runs/card/dev-report.json --title 'NEXBENCH' > /dev/null
      - name: Python agent SDK drives the harness end-to-end
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ./python
          python3 examples/python-endpoint/server.py &
          srv=$!
          sleep 2
          node dist/src/cli/index.js run --agent http://localhost:8700/step --trials 1 --out runs/py >/dev/null
          kill "$srv"
          python3 - <<'PY'
          import json
          report = json.load(open("runs/py/dev-report.json"))
          scores = {t["id"]: t["passAt1"] for t in report["results"]["tasks"]}
          assert scores["NB-SEC-013"] == 100, scores
          assert scores["NB-EXE-004"] == 100, scores
          assert report["integrity"]["canaryClean"] is True
          print("python SDK e2e OK:", scores)
          PY
      - name: Experiments run
        run: |
          node dist/experiments/grid-detection.js
          node dist/experiments/bootstrap-calibration.js

  # Dogfood: run the composite action from this repo against itself, so the
  # action's wiring is verified on every push rather than assumed.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the NEXBENCH action (scripted baseline must clear the gate)
        id: bench
        uses: ./
        with:
          agent: scripted
          trials: '2'
          fail-under: '99'
      - name: Outputs are populated
        env:
          PASS: ${{ steps.bench.outputs.pass-at-1 }}
          SVR: ${{ steps.bench.outputs.svr }}
          CANARY: ${{ steps.bench.outputs.canary-clean }}
        run: |
          set -euo pipefail
          echo "pass@1=$PASS svr=$SVR canary=$CANARY"
          [ "$CANARY" = "true" ]
          awk -v p="$PASS" 'BEGIN { exit (p+0 >= 99) ? 0 : 1 }'
