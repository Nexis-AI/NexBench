name: publish-npm

# The npm package's Trusted Publisher must point at this exact workflow file.
# GitHub OIDC supplies short-lived publish credentials; no NPM_TOKEN is used.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm CLI with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - run: npm ci
      - name: Verify tests and immutable release metadata
        run: |
          npm test
          npm run release:verify
      - name: Publish with Sigstore provenance
        run: npm publish --access public --provenance

