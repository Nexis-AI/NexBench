name: publish-gpr

# Publishes the package to GitHub Packages (npm.pkg.github.com) as the scoped
# name @nexis-ai/nexbench whenever a Release is published. Uses the built-in
# GITHUB_TOKEN (packages: write) — no personal token needed. The npmjs.com
# package stays the unscoped `nexbench`; the scope is applied only at publish
# time and never committed.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: '@nexis-ai'
      - run: npm ci
      - name: Verify tests and immutable release metadata
        run: |
          npm test
          npm run release:verify
      - name: Scope the package for GitHub Packages (not committed)
        run: |
          npm pkg set name=@nexis-ai/nexbench
          npm pkg delete scripts.prepare scripts.prepublishOnly
      - name: Publish to GitHub Packages
        # Verification and compilation finish before the temporary package rename.
        # The publish artifact intentionally omits release-only lifecycle scripts.
        run: npm publish --ignore-scripts --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
